<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - UserAuth</title>
    <style>
        /* =====================
           Reset & Global Styles
        ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background image */
            background-image: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1950&q=80');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        /* =====================
           Header
        ===================== */
        header {
            background: rgba(31,58,96,0.85);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
        }

        header nav a {
            color: #ffffff;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
        }

        header nav a:hover {
            color: #00bfa5;
            text-shadow: 0 0 3px rgba(0,191,165,0.5);
        }

        /* =====================
           Main Content
        ===================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 50px 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #1f3a60;
            text-shadow: 0 0 2px rgba(0,0,0,0.2);
        }

        /* =====================
           Forms
        ===================== */
        form {
            background: rgba(255,255,255,0.95);
            padding: 35px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            border: 1px solid #ccd6dd;
            transition: 0.3s;
        }

        form:hover {
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        /* =====================
           Input Fields with Icons
        ===================== */
        .input-container {
            position: relative;
            width: 100%;
            margin: 12px 0;
        }

        .input-container .icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        .input-container input {
            width: 100%;
            padding: 10px 10px 10px 40px; /* space for icon */
            border: 1px solid #ccd6dd;
            border-radius: 6px;
            transition: 0.3s;
        }

        .input-container input:focus {
            border-color: #00bfa5;
            box-shadow: 0 0 8px rgba(0,191,165,0.2);
            outline: none;
        }

        /* =====================
           Form Messages
        ===================== */
        #loginMessage {
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }

        /* =====================
           Buttons
        ===================== */
        form button {
            width: 100%;
            padding: 16px;
            background: #1f3a60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        form button:hover {
            background: #00bfa5;
            box-shadow: 0 0 8px rgba(0,191,165,0.5);
        }

        /* =====================
           Footer
        ===================== */
        footer {
            background: rgba(31,58,96,0.85);
            padding: 20px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        /* =====================
           Responsive
        ===================== */
        @media screen and (max-width: 600px){
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            header nav {
                margin-top: 10px;
            }
            form {
                padding: 25px;
            }
        }
    </style>
    <script src="auth.js"></script>
</head>
<body>
<header>
    <h1>UserAuthentication</h1>
    <nav>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main>
    <h2>Login</h2>
    <form id="loginForm">
        <div class="input-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="icon" alt="User Icon">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" class="icon" alt="Lock Icon">
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <p id="loginMessage"></p>
        <button type="submit">Login</button>
    </form>
</main>

<footer>
    &copy; 2025 UserAuth. All Rights Reserved.
</footer>
</body>
</html>
